<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>楽曲依頼シート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 設定はJS側の APPS_SCRIPT_URL だけ ===== */
:root{
  --paper:#f3ede1; --sheet:#fbf8f1; --ink:#2b2622; --sub:#6d635a; --line:#d8cfc0;
  --accent:#b8492f; --accent-soft:#f1d9cf; --ok:#4c6b3c; --focus:#e8b04a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1a17; --sheet:#26221e; --ink:#ece5da; --sub:#a89d90; --line:#3d3630;
    --accent:#e0775a; --accent-soft:#3e2a22; --ok:#9cc083; --focus:#e8b04a;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif; line-height:1.7;
  background-image:radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);
  background-size:5px 7px;
}
.wrap{max-width:680px; margin:0 auto; padding:32px 16px 80px}
header h1{
  font-family:"Zen Maru Gothic",sans-serif; font-size:30px; margin:0 0 4px;
  transform:rotate(-1.2deg); display:inline-block;
  border-bottom:3px solid var(--accent); padding:0 6px 2px 2px;
}
header p{color:var(--sub); margin:10px 0 28px; font-size:14px}

section.card{
  background:var(--sheet); border:1.5px solid var(--line); padding:20px 18px 22px;
  margin:0 0 26px; position:relative;
  border-radius:3px 7px 4px 6px / 6px 3px 7px 4px;
  box-shadow:2px 3px 0 rgba(0,0,0,.05);
}
section.card:nth-of-type(odd){transform:rotate(.25deg)}
section.card:nth-of-type(even){transform:rotate(-.3deg)}
section.card h2{
  font-family:"Zen Maru Gothic",sans-serif; font-size:18px; margin:0 0 14px;
  display:flex; align-items:baseline; gap:10px;
}
section.card h2 .no{
  color:var(--accent); font-size:15px; border:1.5px solid var(--accent);
  border-radius:50% 45% 52% 48%; width:28px; height:28px; display:inline-grid; place-items:center;
  transform:rotate(-6deg);
}
.hint{color:var(--sub); font-size:13px; margin:-6px 0 12px}
label.f{display:block; font-size:14px; font-weight:700; margin:14px 0 5px}
label.f small{font-weight:400; color:var(--sub); margin-left:6px}
.req{color:var(--accent); font-size:12px; margin-left:4px}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],textarea{
  width:100%; font:inherit; color:var(--ink); background:transparent;
  border:none; border-bottom:1.5px dashed var(--line); padding:6px 2px; outline:none;
}
textarea{border:1.5px dashed var(--line); border-radius:4px; padding:8px; min-height:90px; resize:vertical}
input:focus,textarea:focus{border-color:var(--accent); background:rgba(232,176,74,.07)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:0 18px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips input{position:absolute; opacity:0; pointer-events:none}
.chips label{
  cursor:pointer; padding:5px 13px; border:1.5px solid var(--line); font-size:14px;
  border-radius:14px 10px 13px 11px; background:var(--sheet); user-select:none;
}
.chips label:nth-child(3n){transform:rotate(-1deg)}
.chips label:nth-child(3n+1){transform:rotate(.8deg)}
.chips input:checked + span{color:var(--accent); font-weight:700}
.chips label:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.chips label:has(input:focus-visible){outline:2px solid var(--focus)}
.inline{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px}
.inline input{max-width:140px}

/* 曲構成 */
#blocks{list-style:none; margin:0; padding:0}
.blk{
  display:grid; grid-template-columns:28px 1fr 92px 30px; align-items:center; gap:8px;
  padding:7px 6px; margin:0 0 7px; background:var(--paper);
  border:1.5px solid var(--line); border-radius:5px 3px 6px 4px;
  touch-action:none;
}
.blk.zero{opacity:.45}
.blk.dragging{box-shadow:3px 5px 0 rgba(0,0,0,.12); border-color:var(--accent); position:relative; z-index:2}
.grip{cursor:grab; color:var(--sub); font-size:18px; text-align:center; line-height:1; user-select:none; touch-action:none}
.blk input.nm{border-bottom:none; font-weight:700}
.bars{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--sub)}
.bars input{text-align:right; padding:4px 2px}
.del{background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:0}
.del:hover{color:var(--accent)}
.ph{height:40px; border:1.5px dashed var(--accent); border-radius:5px; margin:0 0 7px}
.btn-add{
  font:inherit; font-size:14px; background:none; cursor:pointer; color:var(--ink);
  border:1.5px dashed var(--sub); padding:6px 14px; border-radius:12px 9px 13px 8px; margin-top:4px;
}
.btn-add:hover{border-color:var(--accent); color:var(--accent)}
.total{margin-top:10px; font-size:13px; color:var(--sub)}
.preview{margin-top:6px; font-size:13px; color:var(--sub); word-break:break-all}

.ref{display:flex; gap:6px; align-items:center; margin-bottom:4px}
.ref input{flex:1}

.submit{
  display:block; width:100%; font:inherit; font-family:"Zen Maru Gothic",sans-serif; font-size:18px; font-weight:700;
  background:var(--accent); color:#fff; border:none; padding:14px; cursor:pointer;
  border-radius:8px 5px 9px 6px; transform:rotate(-.4deg); box-shadow:3px 4px 0 rgba(0,0,0,.15);
}
.submit:disabled{opacity:.6; cursor:wait}
.err{color:var(--accent); font-size:14px; margin:0 0 12px; min-height:1em}
.hp{position:absolute; left:-9999px}
#done{display:none; text-align:center; padding:60px 10px}
#done h2{font-family:"Zen Maru Gothic",sans-serif; font-size:24px; transform:rotate(-1deg)}
</style>
</head>
<body>
<div class="wrap">
  <form id="f" novalidate>
  <header>
    <h1>楽曲依頼シート</h1>
    <p>曲づくりに必要なことを、この1枚にまとめて書いてください。わからない項目は空欄のままで大丈夫です。</p>
  </header>

  <section class="card">
    <h2><span class="no">1</span>お名前と連絡先</h2>
    <p class="hint">本名とアーティスト名は、どちらか一方だけでもOKです。</p>
    <div class="row2">
      <div><label class="f" for="realName">本名</label><input type="text" id="realName" autocomplete="name"></div>
      <div><label class="f" for="artistName">アーティスト名</label><input type="text" id="artistName"></div>
    </div>
    <p class="hint" style="margin-top:14px">連絡先は、やりとりに使うものを1つ以上。</p>
    <label class="f" for="email">メールアドレス</label><input type="email" id="email" autocomplete="email">
    <div class="row2">
      <div><label class="f" for="sns">SNS<small>サービス名と@ID</small></label><input type="text" id="sns" placeholder="例：X @xxxx"></div>
      <div><label class="f" for="line">LINE名<small>LINEでやりとりする場合</small></label><input type="text" id="line"></div>
    </div>
  </section>

  <section class="card">
    <h2><span class="no">2</span>どんな曲か</h2>
    <label class="f">用途<span class="req">必須</span></label>
    <div class="chips" id="usage">
      <label><input type="radio" name="usage" value="BGM"><span>BGM</span></label>
      <label><input type="radio" name="usage" value="歌を乗せるトラック"><span>歌を乗せるトラック</span></label>
      <label><input type="radio" name="usage" value="カラオケ"><span>カラオケ</span></label>
      <label><input type="radio" name="usage" value="効果音"><span>効果音</span></label>
      <label><input type="radio" name="usage" value="ゲーム音楽"><span>ゲーム音楽</span></label>
      <label><input type="radio" name="usage" value="その他"><span>その他</span></label>
    </div>
    <div class="inline" id="usageOtherWrap" hidden><input type="text" id="usageOther" placeholder="用途を書いてください" style="max-width:none"></div>

    <label class="f">テンポ（BPM）<small>選ぶか、数字を直接入力</small></label>
    <div class="chips" id="bpmChips">
      <label><input type="radio" name="bpm" value="おまかせ"><span>おまかせ</span></label>
      <label><input type="radio" name="bpm" value="ゆっくり（〜80）"><span>ゆっくり 〜80</span></label>
      <label><input type="radio" name="bpm" value="ふつう（80〜110）"><span>ふつう 80〜110</span></label>
      <label><input type="radio" name="bpm" value="はやめ（110〜140）"><span>はやめ 110〜140</span></label>
      <label><input type="radio" name="bpm" value="速い（140〜）"><span>速い 140〜</span></label>
    </div>
    <div class="inline"><span style="font-size:14px">BPM</span><input type="number" id="bpmNum" min="30" max="300" placeholder="例：92"></div>

    <label class="f" for="length">曲の長さの目安<small>任意</small></label>
    <input type="text" id="length" placeholder="例：1分30秒くらい／ループ素材">
  </section>

  <section class="card">
    <h2><span class="no">3</span>曲の構成</h2>
    <p class="hint">⠿ をつかんで順番を入れ替えられます。小節数が 0 か空欄の段は送られません。名前を消した段は自動で消えます。</p>
    <ul id="blocks"></ul>
    <button type="button" class="btn-add" id="addBlk">＋ 段を追加</button>
    <div class="total" id="total"></div>
    <div class="preview" id="preview"></div>
  </section>

  <section class="card">
    <h2><span class="no">4</span>曲調・参考曲</h2>
    <label class="f" for="mood">曲調・イメージ</label>
    <textarea id="mood" placeholder="例：夜の街を歩いてるような、少し寂しいけど前向きな感じ。ピアノ多め。"></textarea>
    <label class="f">参考曲<small>URLか曲名・アーティスト名</small></label>
    <div id="refs"></div>
    <button type="button" class="btn-add" id="addRef">＋ 参考曲を追加</button>
  </section>

  <section class="card">
    <h2><span class="no">5</span>その他</h2>
    <label class="f" for="deadline">希望の納期<small>任意</small></label>
    <input type="date" id="deadline" style="max-width:200px">
    <label class="f" for="note">備考・相談したいこと</label>
    <textarea id="note"></textarea>
  </section>

  <input type="text" class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="err" id="err"></p>
  <button type="submit" class="submit" id="sendBtn">この内容で送る</button>
  </form>

  <div id="done">
    <h2>送信しました</h2>
    <p>内容を確認して、書いてもらった連絡先からご連絡します。</p>
  </div>
</div>

<script>
// ▼ Apps Script を「ウェブアプリ」としてデプロイしたURLを貼る
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEnGL0vEKLX5ZFipJmAL8hrvV_yIRKUnisrkFYvOoWZHgX78B3yk13n4awVdJvpGsD/exec";

const $ = s => document.querySelector(s);

/* ---------- 用途「その他」 ---------- */
document.querySelectorAll('input[name=usage]').forEach(r=>r.addEventListener('change',()=>{
  $('#usageOtherWrap').hidden = r.value!=='その他' || !r.checked;
}));
/* BPM：数字を入れたら選択肢を外す／選択したら数字を消す */
$('#bpmNum').addEventListener('input',()=>{ document.querySelectorAll('input[name=bpm]').forEach(r=>r.checked=false); });
document.querySelectorAll('input[name=bpm]').forEach(r=>r.addEventListener('change',()=>{ $('#bpmNum').value=''; }));

/* ---------- 曲構成ブロック ---------- */
const list = $('#blocks');
const DEFAULTS = [["イントロ",""],["Aメロ",""],["Bメロ",""],["サビ",""],["アウトロ",""]];

function makeBlock(name, bars, focus){
  const li = document.createElement('li');
  li.className = 'blk';
  li.innerHTML = `
    <span class="grip" title="ドラッグで移動">⠿</span>
    <input type="text" class="nm" placeholder="名前（例：Cメロ）">
    <span class="bars"><input type="number" class="br" min="0" max="999" placeholder="0">小節</span>
    <button type="button" class="del" title="この段を消す">×</button>`;
  const nm = li.querySelector('.nm'), br = li.querySelector('.br');
  nm.value = name; br.value = bars;
  // 段の外にフォーカスが移ったとき、名前が空なら消す
  li.addEventListener('focusout', ()=>setTimeout(()=>{
    if(!li.contains(document.activeElement) && !nm.value.trim() && !li.classList.contains('dragging')){ li.remove(); refresh(); }
  }, 120));
  br.addEventListener('input', refresh);
  nm.addEventListener('input', refresh);
  li.querySelector('.del').addEventListener('click', ()=>{ li.remove(); refresh(); });
  li.querySelector('.grip').addEventListener('pointerdown', e=>startDrag(e, li));
  list.appendChild(li);
  if(focus) nm.focus();
  refresh();
  return li;
}
DEFAULTS.forEach(([n,b])=>makeBlock(n,b,false));
$('#addBlk').addEventListener('click', ()=>makeBlock("", "", true));

function blocksData(){
  return [...list.querySelectorAll('.blk')].map(li=>({
    name: li.querySelector('.nm').value.trim(),
    bars: parseInt(li.querySelector('.br').value,10) || 0
  })).filter(b=>b.name && b.bars>0);
}
function refresh(){
  list.querySelectorAll('.blk').forEach(li=>{
    li.classList.toggle('zero', !(parseInt(li.querySelector('.br').value,10)>0));
  });
  const d = blocksData();
  const sum = d.reduce((a,b)=>a+b.bars,0);
  $('#total').textContent = d.length ? `合計 ${sum} 小節` : '';
  $('#preview').textContent = d.length ? d.map(b=>`${b.name}(${b.bars})`).join(' → ') : '';
}

/* ドラッグ＆ドロップ（マウス・タッチ共通） */
let drag = null;
function startDrag(e, li){
  e.preventDefault();
  const r = li.getBoundingClientRect();
  const ph = document.createElement('li'); ph.className='ph'; ph.style.height = r.height+'px';
  li.after(ph);
  li.classList.add('dragging');
  Object.assign(li.style,{position:'fixed', left:r.left+'px', top:r.top+'px', width:r.width+'px', margin:0});
  drag = {li, ph, dy: e.clientY - r.top};
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', endDrag, {once:true});
  document.addEventListener('pointercancel', endDrag, {once:true});
}
function onMove(e){
  if(!drag) return;
  drag.li.style.top = (e.clientY - drag.dy)+'px';
  const others = [...list.querySelectorAll('.blk:not(.dragging)')];
  let placed = false;
  for(const o of others){
    const r = o.getBoundingClientRect();
    if(e.clientY < r.top + r.height/2){ o.before(drag.ph); placed = true; break; }
  }
  if(!placed) list.appendChild(drag.ph);
  // 画面端で自動スクロール
  if(e.clientY < 60) window.scrollBy(0,-8);
  else if(e.clientY > innerHeight-60) window.scrollBy(0,8);
}
function endDrag(){
  if(!drag) return;
  document.removeEventListener('pointermove', onMove);
  const {li, ph} = drag;
  li.classList.remove('dragging');
  li.removeAttribute('style');
  ph.replaceWith(li);
  drag = null;
  refresh();
}

/* ---------- 参考曲 ---------- */
function addRef(val){
  const d = document.createElement('div'); d.className='ref';
  d.innerHTML = `<input type="text" placeholder="https://... または 曲名 / アーティスト"><button type="button" class="del" title="消す">×</button>`;
  d.querySelector('input').value = val||'';
  d.querySelector('.del').addEventListener('click', ()=>{ d.remove(); if(!$('#refs').children.length) addRef(); });
  $('#refs').appendChild(d);
  return d;
}
addRef();
$('#addRef').addEventListener('click', ()=>addRef().querySelector('input').focus());

/* ---------- 送信 ---------- */
$('#f').addEventListener('submit', async e=>{
  e.preventDefault();
  const err = $('#err'); err.textContent='';
  const realName = $('#realName').value.trim(), artistName = $('#artistName').value.trim();
  const email = $('#email').value.trim(), sns = $('#sns').value.trim(), line = $('#line').value.trim();
  const usageR = document.querySelector('input[name=usage]:checked');
  let usage = usageR ? usageR.value : '';
  if(usage==='その他' && $('#usageOther').value.trim()) usage = 'その他：'+$('#usageOther').value.trim();

  const problems = [];
  if(!realName && !artistName) problems.push('本名かアーティスト名のどちらかを入れてください');
  if(!email && !sns && !line) problems.push('連絡先を1つ以上入れてください');
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) problems.push('メールアドレスの形を確認してください');
  if(!usage) problems.push('用途を選んでください');
  if(problems.length){ err.textContent = problems.join('／'); err.scrollIntoView({block:'center',behavior:'smooth'}); return; }

  const bpmR = document.querySelector('input[name=bpm]:checked');
  const bpm = $('#bpmNum').value ? $('#bpmNum').value : (bpmR ? bpmR.value : '');
  const structure = blocksData();

  const payload = {
    realName, artistName, email, sns, line, usage, bpm,
    length: $('#length').value.trim(),
    structure,
    structureText: structure.map(b=>`${b.name}(${b.bars})`).join(' → '),
    totalBars: structure.reduce((a,b)=>a+b.bars,0),
    mood: $('#mood').value.trim(),
    refs: [...document.querySelectorAll('#refs input')].map(i=>i.value.trim()).filter(Boolean),
    deadline: $('#deadline').value,
    note: $('#note').value.trim(),
    website: $('#website').value   // スパム対策（人は入力しない）
  };

  const btn = $('#sendBtn'); btn.disabled = true; btn.textContent = '送信中…';
  try{
    await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    $('#f').style.display='none';
    $('#done').style.display='block';
    window.scrollTo(0,0);
  }catch(ex){
    err.textContent = '送れませんでした。通信状況を確認して、もう一度お試しください。';
    btn.disabled = false; btn.textContent = 'この内容で送る';
  }
});
</script>
</body>
</html>
